version: 2
project_name: servedir
before:
  hooks:
    - npm ci
    - npm run build:web
    - npm run licenses
builds:
  - id: servedir
    main: .
    binary: servedir
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
      - completions/servedir.fish
      - scripts/install.sh
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
release:
  draft: true
